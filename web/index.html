<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameTrix</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; min-height: 100%; background: #edeee9; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    canvas { display: block; width: min(100vw, 160vh) !important; height: auto !important; }
    #loading { position: fixed; z-index: 2; inset: 0; display: grid; place-items: center;
      background: #edeee9; color: #182332; font: 16px Arial, sans-serif; text-align: center; }
    #loading[hidden] { display: none; }
    #loading h1 { font-size: 28px; margin: 0 0 12px; }
    #loading p { color: #637085; margin: 0; }
    #details { max-width: min(650px, 90vw); white-space: pre-wrap; overflow-wrap: anywhere;
      font: 12px monospace; text-align: left; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/pyodide/v0.29.0/full/pyodide.js"></script>
</head>
<body>
  <div id="loading" role="status"><div><h1>GameTrix</h1><p id="status">Loading the game…</p><pre id="details"></pre></div></div>
  <script>
    window.gameFailed = function (error) {
      document.getElementById('loading').hidden = false;
      document.getElementById('status').textContent = 'The game stopped unexpectedly. Reload the page to continue your saved game.';
      document.getElementById('details').textContent = String(error);
      console.error(error);
    };
    async function start() {
      const status = document.getElementById('status');
      try {
        if (typeof loadPyodide !== 'function') throw new Error('The Python runtime could not be downloaded. Check your connection and reload.');
        const py = window.gamePython = await loadPyodide();
        status.textContent = 'Loading game libraries…';
        await py.loadPackage(['micropip', 'pillow']);
        await py.runPythonAsync("import micropip\nawait micropip.install('arcade==4.0.0.dev8', pre=True)");
        status.textContent = 'Preparing the card table…';
        const [archive, boot] = await Promise.all([fetch('./game.zip'), fetch('./boot.py')]);
        if (!archive.ok || !boot.ok) throw new Error('The game files could not be loaded. Reload the page to try again.');
        py.FS.mkdirTree('/game');
        py.unpackArchive(await archive.arrayBuffer(), 'zip', {extractDir: '/game'});
        py.runPython(await boot.text());
        status.textContent = 'Ready';
        document.getElementById('loading').hidden = true;
      } catch (error) {
        status.textContent = 'The game could not start. Check your connection and reload.';
        document.getElementById('details').textContent = String(error);
        console.error(error);
      }
    }
    window.addEventListener('load', start, {once: true});
  </script>
</body>
</html>
